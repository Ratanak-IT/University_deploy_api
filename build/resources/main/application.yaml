minio:
  endpoint: https://s3.careerpatch.site
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

  bucket:
    assets: university-assets
    lessons: university-lessons

spring:
  security:
    oauth2:

      client:
        registration:
          keycloak:
            client-id: university-api
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: http://auth.careerpatch.site/login/oauth2/code/keycloak

        provider:
          keycloak:
            issuer-uri: https://auth.careerpatch.site/realms/university
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: https://auth.careerpatch.site/realms/university

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  logging:
    level:
      org.springframework.security.web.access: DEBUG
      org.springframework.security.authorization: TRACE

  datasource:
    url: jdbc:postgresql://15.235.209.49:1688/university_db
    username: ratanak
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    # Pretty-printing and logging every statement costs real CPU/IO on every
    # request — turned off, since this was running in production. Re-enable
    # locally with -Dspring-boot.run.arguments if you need to see the SQL.
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Lets Hibernate group lazy loads of the same association into one
        # IN-clause query instead of firing one per row — a real difference
        # against a database this far away.
        default_batch_fetch_size: 25

logging:
  level:
    org.springframework.security: INFO

app:
  frontend-url: ${FRONTEND_URL} 

  timezone: Asia/Phnom_Penh

keycloak:
  server-url: https://auth.careerpatch.site

  realm: master
  target-realm: university

  client-id: university-api
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  scope: openid profile email

  admin-client-id: admin-cli
  admin-username: ${KEYCLOAK_ADMIN_USERNAME}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

# Only health is exposed, and only its bare status. The default actuator
# surface leaks env vars, beans and mappings, none of which belong on a
# public port.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: 8081

  # TLS ends at Nginx Proxy Manager, which forwards to this container over
  # plain HTTP. Without this, request.getScheme() reads "http" and every URL
  # the app builds about itself is wrong — the OAuth callback most visibly,
  # which Keycloak then refuses as an unregistered redirect_uri.
  #
  # Safe to trust here because the container publishes no host port: the proxy
  # on the shared Docker network is the only way in, so X-Forwarded-* headers
  # cannot be set by a caller from outside.
  forward-headers-strategy: framework
  max-http-request-header-size: 32KB


