minio:
  endpoint: https://s3.careerpatch.site
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

  bucket:
    assets: university-assets
    lessons: university-lessons

spring:
  security:
    oauth2:

      client:
        registration:
          keycloak:
            client-id: university-api
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: http://auth.careerpatch.site/login/oauth2/code/keycloak

        provider:
          keycloak:
            issuer-uri: https://auth.careerpatch.site/realms/university
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: https://auth.careerpatch.site/realms/university

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  logging:
    level:
      org.springframework.security.web.access: DEBUG
      org.springframework.security.authorization: TRACE

  datasource:
    url: jdbc:postgresql://${DB_URL}
    username: ratanak
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

        default_batch_fetch_size: 25

logging:
  level:
    org.springframework.security: INFO

app:

  # Where login and logout send the browser back to — see AuthController.
  #
  # The defaults are the deployed sites, not localhost. A default is what an
  # environment falls back to when it forgot to set the variable, and the
  # environment most likely to forget is the server: a localhost default means
  # every real user is thrown onto a machine that is not theirs after a
  # successful login, while a production default merely inconveniences one
  # developer who has to set the variable locally.
  #
  # Fail towards the many, not the one.
  frontend-url: ${FRONTEND_URL:https://cambodiaunm.vercel.app}

  admin-frontend-url: ${ADMIN_FRONTEND_URL:https://administrator.cambodiaunm.vercel.app}

  timezone: Asia/Phnom_Penh

keycloak:
  server-url: https://auth.careerpatch.site

  realm: master
  target-realm: university

  client-id: university-api
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  scope: openid profile email

  admin-client-id: admin-cli
  admin-username: ${KEYCLOAK_ADMIN_USERNAME}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: 8081


  forward-headers-strategy: framework
  max-http-request-header-size: 32KB


